<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoje</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hoje"><meta name="theme-color" content="#1f4fa3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='8.5' font-size='8.5'%3E🚇%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#edf1f4;--card:#fff;--tx:#13202b;--mu:#5d6b77;--ac:#1f4fa3;--ac2:#e3ebf8;--bd:#d8e0e6;--bad:#c13b30;--ok:#1d7a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#161e25;--tx:#e6edf2;--mu:#8d9ba6;--ac:#8fb4ff;--ac2:#1b2a40;--bd:#26323b;--bad:#ff8a7a;--ok:#6fd1a4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#161e25;--tx:#e6edf2;--mu:#8d9ba6;--ac:#8fb4ff;--ac2:#1b2a40;--bd:#26323b;--bad:#ff8a7a;--ok:#6fd1a4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:480px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.wrap{display:flex;flex-wrap:wrap;gap:6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.chip,.seg button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px}
.chip.on,.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}
.seg{display:flex;gap:4px;background:var(--ac2);padding:4px;border-radius:999px;margin:4px 0 8px}.seg button{flex:1;border:0;background:transparent}
.btn{width:100%;background:var(--ac);color:var(--card);border:0;border-radius:12px;padding:12px;font-weight:700;margin-top:12px}
.btn.ghost{background:var(--ac2);color:var(--ac)}.link{background:none;border:0;color:var(--ac);padding:4px 0;font-weight:600}
.q{margin:12px 0}.ql{margin-bottom:6px;font-weight:600}.ql .mu{font-weight:400}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{min-height:44px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-weight:700}
.scale button.on{background:var(--ac);color:var(--card);border-color:var(--ac)}
.step{display:flex;align-items:center;gap:14px}.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:20px}.step b{min-width:24px;text-align:center;font-size:18px}
input[type=time],input[type=date],input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:10px;min-height:44px}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d4343a;margin-right:6px}
.hours{display:flex;gap:14px;overflow-x:auto;padding:6px 0 2px}.hours div{text-align:center;min-width:44px;font-size:13px}
.alert{background:var(--ac2);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sc{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.sc b{font-size:20px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.heat{display:grid;grid-template-columns:44px repeat(7,1fr);gap:3px;font-size:10px;color:var(--mu);align-items:center}.heat i{display:block;height:24px;border-radius:5px;background:var(--bg);border:1px solid var(--bd)}
.heat i[data-a]{border:0;cursor:pointer}
.cor{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}.cor span:first-child{font-weight:600;min-width:96px}.cor span:last-child{text-align:right}
.les{padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.tg{display:inline-block;font-size:11px;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 7px;margin-left:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;color:var(--mu);font-weight:600;min-height:48px}nav button.on{color:var(--ac);background:var(--ac2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ago=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1);
const hm=bt=>{const t=(1200+Math.round(bt))%1440;return pad(Math.floor(t/60))+":"+pad(t%60)};
const btp=s=>{const [h,m]=s.split(":").map(Number);return ((h*60+m)-1200+1440)%1440};
const dl=(s,o)=>new Date(s+"T12:00").toLocaleDateString("en-GB",o||{weekday:"short",day:"numeric",month:"short"});
const ov=e=>avg([e.mood,e.energy,e.sleep,e.focus,6-e.stress]);
const M={mood:["Mood","#2f6fe0"],energy:["Energy","#e59a1f"],sleep:["Sleep","#7a5bd6"],stress:["Stress","#d4453a"],focus:["Focus","#1a9c7b"],coffees:["Coffees","#8a6a4f"],alcohol:["Alcohol","#c0489a"],dinner:["Dinner","#7d8a2e"]};
const TAGS=["Work","Research","Health","Relationships","Money","Other"];

/* ---------- mock data ---------- */
let sd=11;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cl=v=>Math.max(1,Math.min(5,Math.round(v)));
const NOTES=["Long meeting day","Good deadline push","Late dinner with friends","Felt scattered after lunch","Quiet, productive morning","Rainy and slow"];
const DEMO=location.search.includes("demo");
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const D=DEMO?[]:(load("hoje.D")||[]);
for(let i=DEMO?60:0;i>=1;i--){const dt=ago(i),wk=dt.getDay()%6==0;
 const wo=rnd()<.4?1:0,al=wk&&rnd()<.6?1+Math.floor(rnd()*3):(rnd()<.1?1:0),cf=1+Math.floor(rnd()*4),rain=rnd()<.3?60+Math.floor(rnd()*30):Math.floor(rnd()*25);
 const bt=90+Math.floor(rnd()*150)+(al?30:0),w=rnd(),wfh=w<.4?"yes":w<.55?"half":"no",tr=(60-i)/60*.5;
 const sl=cl(3.3+(bt<180?.7:-.2)-al*.3-(cf>3?.4:0)+(rnd()-.5)*1.4);
 D.push({d:iso(dt),mood:cl(3+wo*.6+(sl-3)*.4+tr-al*.2+(rnd()-.5)*1.2),energy:cl(2.9+wo*.4+(sl-3)*.5+(rnd()-.5)*1.2),sleep:sl,
  stress:cl(2.8+(wfh=="no"?.5:-.1)+(cf>3?.3:0)-wo*.3+(rnd()-.5)*1.4),focus:cl(3+(sl-3)*.3-(cf>3?.2:0)+(wfh=="yes"?.3:0)+(rnd()-.5)*1.2),
  alcohol:al,bt,wo,wt:"Run",wm:30+Math.floor(rnd()*4)*10,coffees:cf,wfh,dinner:1+Math.floor(rnd()*5),note:rnd()<.3?NOTES[Math.floor(rnd()*6)]:"",rain,cond:rain>50?"Rain":"Cloudy",temp:12+Math.floor(rnd()*10)})}
const lm=(()=>{const d=new Date();d.setHours(12,0,0,0);d.setMonth(d.getMonth()-1);return iso(d)})();
const LT=[[2,"Research","Write the abstract first; the rest of the paper structures itself."],[4,"Health","A 20-minute walk after lunch beats a third coffee."],[6,"Work","Ask for the decision criteria before debating the options."],[9,"Work","Short, specific messages get answered faster than long ones."],[13,"Relationships","Cooking together on weeknights is the easiest way to talk properly."],[17,"Research","Check a data source’s update frequency before building on it."],[21,"Money","Small recurring costs add up faster than big one-off ones."],[27,"Work","Protecting the first hour of the day changes the whole day."],[34,"Health","Sleep before midnight is worth more than an extra hour of work."],[41,"Other","Say no early; late no’s cost more."],[50,"Research","Replicating a result by hand once teaches more than reading five papers."],[58,"Relationships","Call when it matters; texting is for logistics."]];
let L=DEMO?LT.map(([n,t,x])=>({d:iso(ago(n)),text:x,tags:[t]})):(load("hoje.L")||[]);
const persist=()=>{if(!DEMO)try{localStorage.setItem("hoje.D",JSON.stringify(D));localStorage.setItem("hoje.L",JSON.stringify(L))}catch(e){}};
if(DEMO)L.push({d:lm,text:"Rest days are part of training, not a break from it.",tags:["Health"]});

/* ---------- state ---------- */
const TODAY=iso(new Date());
const S={tab:"today",ci:"form",range:30,vis:{mood:1,energy:1,sleep:1,stress:1,focus:1,coffees:0,alcohol:0,dinner:0},ins:"weekly",edit:TODAY,dir:null,upd:Date.now(),q:"",ftag:"All"};
let F={},Lf={d:TODAY,text:"",tags:[]};
function loadF(){const e=D.find(x=>x.d===S.edit);F=e?{...e}:{mood:0,energy:0,sleep:0,stress:0,focus:0,alcohol:0,coffees:0,dinner:0,bt:150,wo:0,wt:"Run",wm:30,wfh:"no",note:""}}
loadF();
const win=(n,off)=>{const a=iso(ago(off+n-1)),b=iso(ago(off));return D.filter(e=>e.d>=a&&e.d<=b)};

/* ---------- weather / metro mocks ---------- */
let MT=null,W=null,SP=DEMO?{p:6012.35,pct:.42,t:Date.now()}:null,SYNC="off";
const wl=c=>c==0?"Clear":c<3?"Partly cloudy":c==3?"Overcast":c<50?"Fog":c<60?"Drizzle":c<70?"Rain":c<80?"Snow":c<90?"Showers":"Thunderstorm";
const temp=h=>W?W.hrs[h].t:Math.round(15+4*Math.sin((h-9)/24*2*Math.PI));
const rainP=h=>W?W.hrs[h].p:Math.min(90,8+(h==17||h==18?50:h==16||h==19?30:0));
function vToday(){
 const n=new Date(),h=n.getHours(),nm=h*60+n.getMinutes();
 const hrs=[];for(let k=h;k<24;k++)hrs.push(k);
 let al=null;[[8,9,"08:00–09:30"],[17,18,"17:30–19:00"]].forEach(w=>{if(h<=w[1]){const p=Math.max(rainP(w[0]),rainP(w[1]));if(p>40&&!al)al={p,l:w[2]}}});
 const dk=S.dir||(h<14?"ss":"ae"),gaps=dk=="ss"?[7,6,8,9,6,7,8,6]:[8,6,7,9,7,6,8,7];
 let t=390,k=0,dep=[];if(DEMO){while(t<1440){if(t>=nm)dep.push(t-nm);t+=gaps[k++%gaps.length]}dep=dep.slice(0,3)}else if(MT&&MT.dir==dk)dep=MT.secs.map(s=>Math.max(0,Math.round((s-(Date.now()-MT.at)/1000)/60)));
 const ms=MT&&MT.status&&MT.status.resposta,ok=!ms||ms.vermelha_curta=="normal",stxt=ok?"Normal service":String(ms.vermelha||"Service disruption").trim();
 const mins=m=>m==0?"Now":m+" min";
 const mi=Math.max(0,Math.round((Date.now()-S.upd)/60000));
 const spc=SP&&SP.pct!=null?(SP.pct>=0?"up":"dn"):"mu",spt=SP&&SP.pct!=null?(SP.pct>=0?"+":"")+SP.pct.toFixed(2)+"%":"";
 const spCard=`<div class="card"><div class="row"><h2>S&amp;P 500</h2><span class="mu">${SP&&SP.t?new Date(SP.t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" · delayed":"Delayed"}</span></div><div class="row" style="align-items:baseline"><b style="font-size:28px">${SP?SP.p.toLocaleString("en-US",{maximumFractionDigits:2}):"–"}</b><b class="${spc}">${spt}</b></div></div>`;
 const done=D.some(e=>e.d===TODAY),ld=L.some(x=>x.d===TODAY);
 return `<h1>${dl(TODAY,{weekday:"long",day:"numeric",month:"long"})}</h1><div class="mu">${DEMO?"Demo mode with sample data":"Lisbon · live data"}</div>
 <div class="card"><div class="row"><h2>Lisbon today</h2><span class="mu">${W?W.lab:"–"}</span></div>
 <div class="row"><div class="big">${temp(h)}°</div><div class="mu" style="text-align:right">Feels like ${W?W.fl:temp(h)-2}°<br>Wind ${W?W.wind:14} km/h · Humidity ${W?W.hum:68}%<br>UV index ${W?W.uv:4}</div></div>
 <div class="hours">${hrs.map(x=>`<div><div class="mu">${pad(x)}h</div><b>${temp(x)}°</b><div class="mu">${rainP(x)}%</div></div>`).join("")}</div>
 ${al?`<div class="alert">☂️ Rain likely (${al.p}%) during your ${al.l} commute. Bring an umbrella.</div>`:""}</div>
 <div class="card"><div class="row"><h2><span class="dot"></span>Olaias · Red line</h2><button class="link" data-a="dir">Switch direction</button></div>
 <div class="mu">Towards ${dk=="ss"?"São Sebastião":"Aeroporto"}</div>
 ${dep.length?`<div class="row" style="align-items:flex-end;margin-top:8px"><div class="big">${mins(dep[0])}</div><div class="mu" style="text-align:right">Then ${dep.slice(1).map(mins).join(" · ")}<br>${DEMO?"Estimated times":"Live"}</div></div>`:`<p class="mu">${MT&&MT.err?"Couldn’t load metro times.":DEMO||(MT&&MT.dir==dk)?"No departures found.":"Loading…"}</p>`}
 <div class="alert" style="color:var(${ok?"--ok":"--bad"})">${stxt}</div></div>${spCard}
 <div class="row" style="margin-bottom:8px"><span class="mu">Updated ${mi?mi+" min ago":"just now"} · ${DEMO||SYNC=="off"?"Local only":SYNC=="ok"?"Synced":"Sync failed"}</span><span><button class="link" data-a="export">Export data</button> · <button class="link" data-a="refresh">Refresh</button></span></div>
 <div class="grid"><button class="card" style="text-align:left;margin:0" data-a="tab" data-v="ci"><b>Check-in</b><div class="mu">${done?"Done for today":"Not done yet"}</div></button>
 <button class="card" style="text-align:left;margin:0" data-a="tab" data-v="ls"><b>Lesson</b><div class="mu">${ld?"Added for today":"Not added yet"}</div></button></div>`}

/* ---------- check-in form ---------- */
function vForm(){
 const sc=(k,lab,cap)=>`<div class="q"><div class="ql">${lab} ${cap?`<span class="mu">${cap}</span>`:""}</div><div class="scale">${[1,2,3,4,5].map(i=>`<button data-a="set" data-v="${k}:${i}" class="${F[k]==i?"on":""}">${i}</button>`).join("")}</div></div>`;
 const st=(k,lab)=>`<div class="q"><div class="ql">${lab}</div><div class="step"><button data-a="step" data-v="${k}:-1" aria-label="Less">−</button><b>${F[k]}</b><button data-a="step" data-v="${k}:1" aria-label="More">+</button></div></div>`;
 return `<div class="card"><div class="row"><h2>${S.edit===TODAY?"Today’s check-in":"Editing "+dl(S.edit)}</h2>${S.edit!==TODAY?`<button class="link" data-a="edit" data-v="${TODAY}">Back to today</button>`:""}</div>
 ${sc("mood","Mood")}${sc("energy","Energy")}${sc("sleep","Sleep quality")}${sc("stress","Stress","5 = very stressed")}${sc("focus","Focus")}
 <h3>Habits</h3>${st("alcohol","Alcohol (drinks)")}${st("coffees","Coffees")}
 <div class="q"><div class="ql">Bedtime last night</div><input type="time" data-f="bt" value="${hm(F.bt)}"></div>
 <div class="q"><div class="ql">Sport / workout</div><div class="seg"><button data-a="wo" data-v="0" class="${F.wo?"":"on"}">No</button><button data-a="wo" data-v="1" class="${F.wo?"on":""}">Yes</button></div>
 ${F.wo?`<div class="grid"><select data-f="wt">${["Run","Gym","Cycling","Swim","Football","Other"].map(x=>`<option${F.wt==x?" selected":""}>${x}</option>`).join("")}</select><input type="number" data-f="wm" value="${F.wm}" min="5" step="5" aria-label="Minutes"></div>`:""}</div>
 <div class="q"><div class="ql">Work from home</div><div class="seg">${[["yes","Yes"],["no","No"],["half","Half day"]].map(([v,l])=>`<button data-a="wfh" data-v="${v}" class="${F.wfh==v?"on":""}">${l}</button>`).join("")}</div></div>
 ${sc("dinner","Dinner quantity","1 = very light, 5 = very heavy")}
 <div class="q"><div class="ql">Anything that shaped today?</div><input type="text" data-f="note" value="${esc(F.note||"")}" placeholder="Optional"></div>
 <button class="btn" data-a="save">Save check-in</button></div>`}

/* ---------- trends ---------- */
function chart(ds,labels,ymin,ymax,fmt){
 const W=340,H=170,p={l:34,r:8,t:8,b:20},n=labels.length;
 const x=i=>p.l+(n<2?0:i*(W-p.l-p.r)/(n-1)),y=v=>p.t+(ymax-v)*(H-p.t-p.b)/(ymax-ymin);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend chart">`;
 for(let k=0;k<5;k++){const v=ymin+(ymax-ymin)*k/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${p.l-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--mu)">${fmt?fmt(v):Math.round(v*10)/10}</text>`}
 ds.forEach(d=>{s+=`<polyline fill="none" stroke="${d.c}" stroke-width="2" stroke-linejoin="round" points="${d.v.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`});
 [0,Math.floor((n-1)/2),n-1].forEach(i=>s+=`<text x="${x(i)}" y="${H-5}" text-anchor="${i==0?"start":i==n-1?"end":"middle"}" font-size="9" fill="var(--mu)">${labels[i]}</text>`);
 return s+"</svg>"}
const TIP={mood:"plan one thing each day that you look forward to.",energy:"protect sleep and add a short walk after lunch.",sleep:"aim for a bedtime before 23:00 on weeknights.",stress:"block one low-load hour a day and keep coffees to two.",focus:"cap coffees at two and batch deep work in the morning."};
function insight(n,minN){
 const cur=win(n,0),prev=win(n,n);
 if(cur.length<minN)return `<p class="mu">Not enough data yet: ${cur.length} of ${minN} entries needed.</p>`;
 const a=avg(cur.map(ov)),d=prev.length>=Math.ceil(minN/2)?a-avg(prev.map(ov)):null;
 const tr=d==null?"No earlier period to compare with yet.":Math.abs(d)<.15?"Overall wellbeing is steady versus the previous period.":`Overall wellbeing is ${d>0?"up":"down"} ${f1(Math.abs(d))} points versus the previous period.`;
 const ks=["mood","energy","sleep","stress","focus"].map(k=>[k,avg(cur.map(e=>k=="stress"?6-e.stress:e[k]))]).sort((x,y)=>y[1]-x[1]);
 const b=ks[0][0],w=ks[4][0],wo=cur.filter(e=>e.wo),no=cur.filter(e=>!e.wo);
 const wl=wo.length>=2&&no.length>=2?` On workout days mood averaged ${f1(avg(wo.map(e=>e.mood)))} versus ${f1(avg(no.map(e=>e.mood)))} without.`:"";
 return `<p>${tr}</p><p><b>Strongest:</b> ${b=="stress"?"Stress (low)":M[b][0]}. <b>Weakest:</b> ${w=="stress"?"Stress (running high)":M[w][0]}.</p>
 <p>${wo.length} workout days, ${cur.filter(e=>e.wfh=="yes").length} work-from-home days, ${f1(avg(cur.map(e=>e.coffees)))} coffees a day, average bedtime ${hm(avg(cur.map(e=>e.bt)))}.${wl}</p>
 <p><b>Focus for the next ${n==7?"week":"month"}:</b> ${TIP[w]}</p>`}
function cmp(lab,k,fa,fb,la,lb){const A=D.filter(fa),B=D.filter(fb);if(A.length<3||B.length<3)return "";
 return `<div class="cor"><span>${lab}</span><span><b>${f1(avg(A.map(e=>e[k])))}</b> ${la} (${A.length})<br><b>${f1(avg(B.map(e=>e[k])))}</b> ${lb} (${B.length})</span></div>`}
function vTrends(){
 const n=S.range,cur=win(n,0),prev=win(n,n),keys=Object.keys(M).filter(k=>S.vis[k]);
 let h=`<div class="card"><h2>Insights</h2><div class="seg"><button data-a="ins" data-v="weekly" class="${S.ins=="weekly"?"on":""}">Weekly</button><button data-a="ins" data-v="monthly" class="${S.ins=="monthly"?"on":""}">Monthly</button></div>${S.ins=="weekly"?insight(7,5):insight(30,15)}</div>`;
 h+=`<div class="card"><div class="wrap" style="margin-bottom:10px">${[[7,"7 days"],[30,"30 days"],[90,"90 days"],[9999,"All"]].map(([v,l])=>`<button class="chip ${n==v?"on":""}" data-a="range" data-v="${v}">${l}</button>`).join("")}</div>
 <div class="wrap" style="margin-bottom:6px">${Object.keys(M).map(k=>`<button class="chip ${S.vis[k]?"on":""}" data-a="vis" data-v="${k}">${M[k][0]}</button>`).join("")}</div>
 ${cur.length<2?`<p class="mu">Not enough entries in this range yet.</p>`:chart(keys.map(k=>({c:M[k][1],v:cur.map(e=>e[k])})),cur.map(e=>dl(e.d,{day:"numeric",month:"short"})),0,5)}</div>`;
 h+=`<div class="card"><h2>Averages</h2><div class="grid">${Object.keys(M).map(k=>{const a=avg(cur.map(e=>e[k])),p=avg(prev.map(e=>e[k])),d=prev.length>=3&&n<9999?a-p:null;
  const good=["stress","alcohol"].includes(k)?d<0:["coffees","dinner"].includes(k)?null:d>0;
  return `<div class="sc"><div class="mu">${M[k][0]}</div><b>${f1(a)}</b> <span class="${d==null||good==null||Math.abs(d)<.05?"mu":good?"up":"dn"}">${d==null?"":(d>0?"+":"")+f1(d)}</span></div>`}).join("")}</div>
 <div class="mu" style="margin-top:8px">Change is versus the previous period of the same length.</div></div>`;
 const wo=cur.filter(e=>e.wo).length;
 h+=`<div class="card"><h2>Habits and bedtime</h2><div class="mu">${wo} workout days of ${cur.length} · ${cur.filter(e=>e.wfh=="yes").length} work from home, ${cur.filter(e=>e.wfh=="half").length} half days · average bedtime ${cur.length?hm(avg(cur.map(e=>e.bt))):"–"}</div>
 ${cur.length>=2?chart([{c:"#7a5bd6",v:cur.map(e=>e.bt)}],cur.map(e=>dl(e.d,{day:"numeric",month:"short"})),0,360,hm):""}</div>`;
 const days=Math.min(n,91),st=ago(days-1);st.setDate(st.getDate()-((st.getDay()+6)%7));
 let hc=`<span></span>${"MTWTFSS".split("").map(x=>`<span style="text-align:center">${x}</span>`).join("")}`;
 for(let c=new Date(st);iso(c)<=TODAY;){hc+=`<span>${c.getDate()} ${c.toLocaleDateString("en-GB",{month:"short"})}</span>`;
  for(let j=0;j<7;j++){const k=iso(c),e=D.find(x=>x.d===k);hc+=k>TODAY||!e?`<i style="opacity:${k>TODAY?0:1}"></i>`:`<i data-a="edit" data-v="${k}" title="${dl(k)}: ${f1(ov(e))}" style="background:color-mix(in srgb,var(--ac) ${Math.round(8+(ov(e)-1)/4*88)}%,var(--card))"></i>`;c.setDate(c.getDate()+1)}}
 h+=`<div class="card"><h2>Calendar</h2><div class="heat">${hc}</div><div class="mu" style="margin-top:8px">Darker is a better overall day. Tap a day to edit it.${n>91?" Showing the last 13 weeks.":""}</div></div>`;
 if(cur.length){const s=[...cur].sort((a,b)=>ov(b)-ov(a)),bw=e=>`<div class="mu"><b style="color:var(--tx)">${dl(e.d)}</b> · ${f1(ov(e))}${e.note?" · “"+esc(e.note)+"”":""}</div>`;
  h+=`<div class="card"><h2>Best and worst day</h2>${bw(s[0])}${bw(s[s.length-1])}</div>`}
 h+=`<div class="card"><h2>Patterns</h2>${D.length<21?`<p class="mu">Available after 21 entries (you have ${D.length}).</p>`:
 cmp("Mood","mood",e=>e.wo,e=>!e.wo,"workout","no workout")+cmp("Sleep","sleep",e=>e.bt<180,e=>e.bt>=180,"bed before 23:00","later")+cmp("Stress","stress",e=>e.wfh=="yes",e=>e.wfh=="no","work from home","office")+cmp("Sleep","sleep",e=>!e.alcohol,e=>e.alcohol>0,"no alcohol","alcohol")+cmp("Focus","focus",e=>e.coffees<=2,e=>e.coffees>=3,"0–2 coffees","3+ coffees")+cmp("Mood","mood",e=>e.rain>50,e=>e.rain<=50,"rainy","dry")+`<div class="mu" style="margin-top:6px">Based on all entries. Correlation, not cause.</div>`}</div>`;
 return h}

/* ---------- lessons ---------- */
function vHist(){const q=S.q.toLowerCase(),r=L.filter(x=>(S.ftag=="All"||x.tags.includes(S.ftag))&&(!q||x.text.toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d));
 if(!r.length)return `<p class="mu">No lessons match. Clear the search or pick another tag.</p>`;
 let h="",m="";r.forEach(x=>{const mm=dl(x.d,{month:"long",year:"numeric"});if(mm!=m){m=mm;h+=`<h3>${m}</h3>`}
  h+=`<div class="les" data-a="ledit" data-v="${x.d}"><div class="mu">${dl(x.d)}${x.tags.map(t=>`<span class="tg">${t}</span>`).join("")}</div>${esc(x.text)}</div>`});return h}
function vLessons(){
 const dd=new Date(Lf.d+"T12:00"),a=new Date(dd),b=new Date(dd);a.setMonth(a.getMonth()-1);b.setFullYear(b.getFullYear()-1);
 const re=L.find(x=>x.d===iso(a)),ry=L.find(x=>x.d===iso(b)),r=re?["One month ago",re]:ry?["One year ago",ry]:null;
 const mo=TODAY.slice(0,7),ex=L.some(x=>x.d===Lf.d);
 return `<h1>Lessons</h1><div class="mu">${L.length} lessons · ${L.filter(x=>x.d.startsWith(mo)).length} this month</div>
 ${r?`<div class="card"><div class="mu">${r[0]}, ${dl(r[1].d)}</div><p style="margin:6px 0 0">${esc(r[1].text)}</p></div>`:""}
 <div class="card"><h2>${ex?"Edit lesson":"Lesson of the day"}</h2><textarea rows="3" data-l="text" placeholder="What did today teach you?">${esc(Lf.text)}</textarea>
 <div class="wrap" style="margin:10px 0">${TAGS.map(t=>`<button class="chip ${Lf.tags.includes(t)?"on":""}" data-a="ltag" data-v="${t}">${t}</button>`).join("")}</div>
 <input type="date" data-ld="1" value="${Lf.d}" max="${TODAY}"><div class="mu" style="margin-top:4px">One lesson per day. Saving again replaces it.</div>
 <button class="btn" data-a="lsave">Save lesson</button></div>
 <div class="card"><h2>History</h2><input type="text" data-q="1" value="${esc(S.q)}" placeholder="Search lessons">
 <div class="wrap" style="margin:10px 0">${["All",...TAGS].map(t=>`<button class="chip ${S.ftag==t?"on":""}" data-a="ftag" data-v="${t}">${t}</button>`).join("")}</div><div id="hist">${vHist()}</div></div>`}

/* ---------- shell ---------- */
function draw(){
 $("#app").innerHTML=S.tab=="today"?vToday():S.tab=="ci"?`<h1>Check-in</h1><div class="seg"><button data-a="ci" data-v="form" class="${S.ci=="form"?"on":""}">Today</button><button data-a="ci" data-v="trends" class="${S.ci=="trends"?"on":""}">Trends</button></div>${S.ci=="form"?vForm():vTrends()}`:vLessons();
 $("#nav").innerHTML=[["today","☀️ Today"],["ci","✅ Check-in"],["ls","📝 Lessons"]].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab==k?"on":""}">${l}</button>`).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function act(a,v){
 if(a=="tab"){S.tab=v;scrollTo(0,0)}
 else if(a=="ci"){if(v=="form"&&S.ci!="form"){S.edit=TODAY;loadF()}S.ci=v}
 else if(a=="edit"){S.edit=v;S.tab="ci";S.ci="form";loadF();scrollTo(0,0)}
 else if(a=="set"){const [k,i]=v.split(":");F[k]=+i}
 else if(a=="step"){const [k,d]=v.split(":");F[k]=Math.max(0,Math.min(12,F[k]+ +d))}
 else if(a=="wo")F.wo=+v;else if(a=="wfh")F.wfh=v;
 else if(a=="save"){if(["mood","energy","sleep","stress","focus"].some(k=>!F[k])){toast("Answer all five scores first");return}
  const e={...F,d:S.edit,u:Date.now(),cond:F.cond||(W?W.lab:"–"),temp:F.temp??(W?W.t:17),rain:F.rain??(W?Math.max(...W.hrs.map(x=>x.p)):0)};const i=D.findIndex(x=>x.d===S.edit);if(i>=0)D[i]=e;else D.push(e);D.sort((x,y)=>x.d.localeCompare(y.d));
  push("checkin",e);toast("Check-in saved");S.edit=TODAY;S.ci="trends";scrollTo(0,0)}
 else if(a=="range")S.range=+v;else if(a=="vis")S.vis[v]=S.vis[v]?0:1;else if(a=="ins")S.ins=v;
 else if(a=="dir"){S.dir=(S.dir||(new Date().getHours()<14?"ss":"ae"))=="ss"?"ae":"ss";if(!DEMO)loadMetro()}
 else if(a=="refresh"){if(DEMO)S.upd=Date.now();else{loadMetro();loadWeather();loadSP();sync()}toast("Refreshing…")}
 else if(a=="export"){const b=new Blob([JSON.stringify({checkins:D,lessons:L},null,1)],{type:"application/json"}),u=document.createElement("a");u.href=URL.createObjectURL(b);u.download="hoje-"+TODAY+".json";u.click()}
 else if(a=="ftag")S.ftag=v;
 else if(a=="ltag"){const i=Lf.tags.indexOf(v);i<0?Lf.tags.push(v):Lf.tags.splice(i,1)}
 else if(a=="ledit"){const x=L.find(y=>y.d===v);Lf={d:x.d,text:x.text,tags:[...x.tags]};scrollTo(0,0)}
 else if(a=="lsave"){if(!Lf.text.trim()){toast("Write the lesson first");return}
  const x={d:Lf.d,text:Lf.text.trim(),tags:Lf.tags.length?Lf.tags:["Other"],u:Date.now()},i=L.findIndex(y=>y.d===x.d);if(i>=0)L[i]=x;else L.push(x);push("lesson",x);toast("Lesson saved");Lf={d:TODAY,text:"",tags:[]}}
 persist();draw()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(d.f)F[d.f]=d.f=="wm"?+t.value:d.f=="bt"?btp(t.value||"22:30"):t.value;
 if(d.l)Lf.text=t.value;
 if(d.q){S.q=t.value;$("#hist").innerHTML=vHist()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.ld&&t.value){Lf.d=t.value;const x=L.find(y=>y.d===Lf.d);Lf.text=x?x.text:"";Lf.tags=x?[...x.tags]:[];draw()}});
draw();
async function loadMetro(){const dk=S.dir||(new Date().getHours()<14?"ss":"ae");try{const r=await fetch("/api/metro?dir="+dk),j=await r.json();MT=j.error?{dir:dk,secs:[],err:1}:{...j,at:Date.now()}}catch(e){MT={dir:dk,secs:[],err:1}}S.upd=Date.now();if(S.tab=="today")draw()}
async function loadWeather(){try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=38.72&longitude=-9.14&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,uv_index&timezone=Europe%2FLisbon&forecast_days=1"),j=await r.json(),c=j.current,H=j.hourly,h=new Date().getHours();
 W={t:Math.round(c.temperature_2m),fl:Math.round(c.apparent_temperature),hum:c.relative_humidity_2m,wind:Math.round(c.wind_speed_10m),uv:Math.round((H.uv_index||[])[h]||0),lab:wl(c.weather_code),hrs:H.temperature_2m.map((t,i)=>({t:Math.round(t),p:H.precipitation_probability[i]||0}))}}catch(e){}if(S.tab=="today")draw()}
async function loadSP(){try{const r=await fetch("/api/sp500"),j=await r.json();if(j.p)SP={p:j.p,pct:j.pct??null,t:j.t||null}}catch(e){}if(S.tab=="today")draw()}
const pin=()=>{try{let p=localStorage.getItem("hoje.pin");if(!p){p=prompt("Enter your Hoje PIN to sync your data");if(p)localStorage.setItem("hoje.pin",p)}return p}catch(e){return null}};
async function api(body){const p=pin();if(!p)throw 0;const r=await fetch("/api/data",{method:body?"POST":"GET",headers:{"x-pin":p,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(r.status==401){localStorage.removeItem("hoje.pin");throw 0}if(!r.ok)throw 0;return r.json()}
const push=(type,r)=>{if(!DEMO)api({type,records:[r]}).then(()=>{SYNC="ok";if(S.tab=="today")draw()}).catch(()=>{SYNC="err"})};
async function sync(){if(DEMO)return;try{const R=await api(),mg=(loc,rem)=>{const m=new Map(rem.map(x=>[x.d,x])),up=[];loc.forEach(x=>{const y=m.get(x.d);if(!y||(x.u||0)>(y.u||0)){m.set(x.d,x);up.push(x)}});return[[...m.values()].sort((a,b)=>a.d.localeCompare(b.d)),up]};
 const[c,uc]=mg(D,R.checkins),[l,ul]=mg(L,R.lessons);D.splice(0,D.length,...c);L.splice(0,L.length,...l);persist();
 if(uc.length)await api({type:"checkin",records:uc});if(ul.length)await api({type:"lesson",records:ul});SYNC="ok"}catch(e){SYNC="err"}
 if(!F.mood&&!F.energy)loadF();draw()}
if(!DEMO){loadMetro();loadWeather();loadSP();sync();setInterval(()=>{if(S.tab=="today"&&!document.hidden)loadSP()},300000);setInterval(()=>{if(S.tab=="today"&&!document.hidden)loadMetro()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadMetro();loadWeather();loadSP();sync()}});try{navigator.serviceWorker.register("/sw.js")}catch(e){}}
</script></body></html>
